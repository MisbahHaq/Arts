<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katrina Romulo - Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="logo">
        <img src="assets/1.png" alt="Logo" />
      </div>

      <!-- Desktop links -->
      <div class="nav-links">
        <a href="#">shop</a>
        <a href="#" class="active">work</a>
        <a href="#">about</a>
        <a href="#">play</a>
        <div class="social">
          <a href="#">IG</a>
          <a href="#">email</a>
        </div>
      </div>

      <!-- Hamburger -->
      <div class="menu-btn" onclick="openMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

    <!-- Fullscreen Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <div class="close-btn" onclick="closeMenu()">×</div>

      <a href="#" onclick="closeMenu()">shop</a>
      <a href="#" onclick="closeMenu()">work</a>
      <a href="#" onclick="closeMenu()">about</a>
      <a href="#" onclick="closeMenu()">play</a>
    </div>

    <section class="hero">
      <p>
        Katrina Romulo is a multidisciplinary designer. She loves roasted
        vegetables, the Bay Area, and book covers. She currently
        <span class="underline">works</span> and lives in Los Angeles,
        California.
      </p>
    </section>

    <section class="gallery">
      <div class="image-grid">
        <img src="assets/2.png" alt="Food photography" />
        <img src="assets/3.png" alt="Product shot" />
      </div>
    </section>

    <script>
      function openMenu() {
        document.getElementById("mobileMenu").classList.add("active");
      }

      function closeMenu() {
        document.getElementById("mobileMenu").classList.remove("active");
      }
    </script>
  </body>
</html>
