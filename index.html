<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Designer Landing</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAV -->
    <header>
      <div class="logo">KR</div>

      <nav>
        <a href="#">shop</a>
        <a href="#" class="active">work</a>
        <a href="#">about</a>
        <a href="#">play</a>
        <div class="icons">
          <a href="#">◎</a>
          <a href="#">✉</a>
        </div>
      </nav>
    </header>

    <!-- HERO TEXT -->
    <section class="hero">
      <p>
        Katrina Romulo is a multidisciplinary designer. She loves roasted
        vegetables, the Bay Area, and book covers. She currently works and lives
        in Los Angeles, California.
      </p>
    </section>

    <!-- IMAGE GRID -->
    <section class="gallery">
      <div class="image-box">
        <img src="./assets/1.png" alt="Image 1" />
        <div class="image-title">Title 1</div>
      </div>

      <div class="image-box">
        <img src="./assets/2.png" alt="Image 2" />
        <div class="image-title">Title 2</div>
      </div>
    </section>
  </body>
</html>
